[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-agents"
version = "0.1.0"
description = "LangGraph-based ecommerce customer support agents (order management first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
order-agent = "ecommerce_agents.main:main"
order-agent-cli = "ecommerce_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_agents"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real service (Neon Postgres); skipped when not configured",
    "slow: slow test; deselect with -m 'not slow'",
    "eval: agent evaluation against a real LLM; slow, costs money, non-deterministic",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
